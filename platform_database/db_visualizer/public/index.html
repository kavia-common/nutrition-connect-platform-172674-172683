<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Simple DB Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: sans-serif; margin: 0; background: #0b0f14; color: #e5e7eb; }
      header { padding: 16px; background: #111827; border-bottom: 1px solid #1f2937; }
      h1 { margin: 0; font-size: 18px; color: #f97316; }
      .container { padding: 16px; display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
      .panel { background: #111827; border: 1px solid #1f2937; border-radius: 8px; overflow: hidden; }
      .panel h2 { margin: 0; padding: 12px 16px; background: #0f172a; font-size: 14px; border-bottom: 1px solid #1f2937; color: #10b981; }
      .panel .content { padding: 12px 16px; }
      .tag { display: inline-block; background: #f97316; color: black; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-right: 8px; }
      .db-item { padding: 8px; border: 1px solid #1f2937; border-radius: 6px; margin-bottom: 8px; cursor: pointer; background: #0b1220; }
      .db-item:hover { background: #0e1626; }
      .table-item { padding: 6px 8px; border: 1px solid #1f2937; border-radius: 6px; margin: 6px 0; cursor: pointer; background: #0b1220; font-size: 14px; }
      .table-item:hover { background: #0e1626; }
      pre { background: #0b1220; padding: 12px; border: 1px solid #1f2937; border-radius: 8px; overflow: auto; }
      code { color: #d1d5db; }
      .hint { color: #9ca3af; font-size: 12px; }
      .badge { background: #10b981; color: black; padding: 2px 6px; border-radius: 6px; font-size: 12px; margin-left: 6px; }
      a { color: #60a5fa; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Database Viewer <span class="tag">localhost</span></h1>
      <div class="hint">Expected env: POSTGRES_URL or POSTGRES_* variables. Backend reads db_visualizer/*.env on startup.</div>
    </header>

    <div class="container">
      <div class="panel">
        <h2>Available Databases</h2>
        <div class="content" id="dbList">
          <div class="hint">Loading...</div>
        </div>
      </div>
      <div class="panel">
        <h2>Tables <span id="currentDb" class="badge" style="display:none;"></span></h2>
        <div class="content">
          <div id="tableList"><div class="hint">Select a database type to list tables.</div></div>
          <hr style="border-color:#1f2937;border-width:1px; margin:16px 0;">
          <div id="dataArea"><div class="hint">Select a table to preview rows.</div></div>
        </div>
      </div>
    </div>

    <script>
      const dbListEl = document.getElementById('dbList');
      const tableListEl = document.getElementById('tableList');
      const dataAreaEl = document.getElementById('dataArea');
      const currentDbBadge = document.getElementById('currentDb');

      async function loadDatabases() {
        dbListEl.innerHTML = '<div class="hint">Loading...</div>';
        try {
          const res = await fetch('/api/databases');
          const json = await res.json();
          if (!Array.isArray(json) || json.length === 0) {
            dbListEl.innerHTML = '<div class="hint">No databases available. Ensure postgres.env exists and POSTGRES_URL points to localhost:5002.</div>';
            return;
          }
          dbListEl.innerHTML = '';
          json.forEach(db => {
            const item = document.createElement('div');
            item.className = 'db-item';
            item.textContent = db.toUpperCase();
            item.onclick = () => loadTables(db);
            dbListEl.appendChild(item);
          });
        } catch (e) {
          dbListEl.innerHTML = '<div class="hint">Error loading databases: ' + e.message + '</div>';
        }
      }

      async function loadTables(db) {
        currentDbBadge.style.display = 'inline-block';
        currentDbBadge.textContent = db.toUpperCase();
        tableListEl.innerHTML = '<div class="hint">Loading tables...</div>';
        dataAreaEl.innerHTML = '<div class="hint">Select a table to preview rows.</div>';
        try {
          const res = await fetch(`/api/${db}/tables`);
          const json = await res.json();
          if (json.error) throw new Error(json.error);
          tableListEl.innerHTML = '';
          if (!Array.isArray(json) || json.length === 0) {
            tableListEl.innerHTML = '<div class="hint">No tables found in schema.</div>';
            return;
          }
          json.forEach(t => {
            const item = document.createElement('div');
            item.className = 'table-item';
            item.textContent = t.table_name || Object.values(t)[0];
            item.onclick = () => loadData(db, item.textContent);
            tableListEl.appendChild(item);
          });
        } catch (e) {
          tableListEl.innerHTML = '<div class="hint">Error loading tables: ' + e.message + '</div>';
        }
      }

      async function loadData(db, table) {
        dataAreaEl.innerHTML = '<div class="hint">Loading data...</div>';
        try {
          const res = await fetch(`/api/${db}/tables/${encodeURIComponent(table)}/data?limit=50`);
          const json = await res.json();
          if (json.error) throw new Error(json.error);
          const pretty = JSON.stringify(json, null, 2);
          dataAreaEl.innerHTML = '<pre><code>' + pretty + '</code></pre>';
        } catch (e) {
          dataAreaEl.innerHTML = '<div class="hint">Error loading data: ' + e.message + '</div>';
        }
      }

      loadDatabases();
    </script>
  </body>
</html>
